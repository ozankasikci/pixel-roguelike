name: Build Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: C:/vcpkg/installed
          key: vcpkg-x64-windows-${{ hashFiles('.github/workflows/build-windows.yml') }}
          restore-keys: vcpkg-x64-windows-

      - name: Install dependencies
        run: vcpkg install glfw3:x64-windows glm:x64-windows spdlog:x64-windows openal-soft:x64-windows zlib:x64-windows

      - name: Setup Python for GLAD
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install GLAD jinja2 dependency
        run: pip install jinja2

      - name: Configure CMake
        run: >
          cmake -B build -S .
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DCMAKE_BUILD_TYPE=Release
          -DPython_EXECUTABLE=python

      - name: Build
        run: cmake --build build --config Release --parallel --target pixel-roguelike level-editor

      - name: Run tests
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            build/Release/*.exe
            build/apps/**/Release/*.exe
          retention-days: 7
