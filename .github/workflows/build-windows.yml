name: Build Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: C:/vcpkg/installed
          key: vcpkg-x64-windows-${{ hashFiles('CMakePresets.json') }}
          restore-keys: vcpkg-x64-windows-

      - name: Install vcpkg dependencies
        run: vcpkg install glfw3:x64-windows glm:x64-windows spdlog:x64-windows openal-soft:x64-windows zlib:x64-windows

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install jinja2 for GLAD
        run: pip install jinja2

      - name: Configure
        run: cmake --preset ci-windows -DPython_EXECUTABLE=python

      - name: Build
        run: cmake --build build --config Release --parallel --target pixel-roguelike

      - name: Upload game
        uses: actions/upload-artifact@v4
        with:
          name: pixel-roguelike-windows
          path: |
            build/apps/runtime/Release/pixel-roguelike.exe
            assets/
          retention-days: 7
